/* Eco Aroma do'kon — shalfey dizayni. Yorug' rejimda o'z ranglari, Telegram qorong'i bo'lsa — qorong'i variant. */
:root{--bg:#eef2ec;--fg:#22302a;--muted:#56665d;--card:#fcfdfb;--soft:#dcebe0;--acc:#3d7a5c;--accfg:#fff;--line:#d5ded3;--warn:#b0453b}
@media (prefers-color-scheme:dark){html:not([data-scheme=light]){--bg:#111814;--fg:#e2ebe4;--muted:#9fb1a6;--card:#18211c;--soft:#213a2d;--acc:#86c6a1;--accfg:#0f1a14;--line:#2c3a33;--warn:#ec9a90}}
html[data-scheme=dark]{--bg:#111814;--fg:#e2ebe4;--muted:#9fb1a6;--card:#18211c;--soft:#213a2d;--acc:#86c6a1;--accfg:#0f1a14;--line:#2c3a33;--warn:#ec9a90}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 104px;-webkit-font-smoothing:antialiased;max-width:720px;margin-inline:auto}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
header{padding:18px 0 10px}
.hero{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
.hero img{width:58px;height:58px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line)}
header h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.back{border:0;background:none;color:var(--acc);padding:0 0 10px;font-weight:600;font-size:16px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:6px 0 12px;font-size:16px}
.search:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;white-space:nowrap;font-weight:550;font-size:15px}
.chips .on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.item.off{opacity:.55}
.nm{flex:1;font-weight:600;line-height:1.3}
.nm small{display:block;font-weight:600;color:var(--acc);margin-top:4px;font-size:15px;font-variant-numeric:tabular-nums}
.item.off .nm small{color:var(--muted);font-weight:500}
.pic{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft);cursor:zoom-in}
.pic.none{display:flex;align-items:center;justify-content:center;font-weight:650;font-size:22px;color:var(--acc);cursor:default}
/* Katalog: ikki ustunli kartalar, rasm katta */
.list.cat{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.list.cat .item{flex-direction:column;align-items:stretch;padding:8px 8px 10px;gap:8px}
.list.cat .pic{width:100%;height:auto;aspect-ratio:1/1;border-radius:12px}
.list.cat .pic.none{aspect-ratio:4/3;font-size:28px}
.list.cat .nm{padding:0 4px;font-size:15px}
.list.cat .add,.list.cat .qty{margin:0 2px}
.list.cat .add{width:100%;padding:10px}
.list.cat .qty{justify-content:space-between}
.zoom{position:fixed;inset:0;background:rgba(10,16,12,.86);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;padding:24px}
.zoom img{max-width:100%;max-height:70vh;border-radius:18px;background:#fff}
.add{border:0;background:var(--acc);color:var(--accfg);border-radius:12px;padding:9px 16px;font-weight:600;min-height:42px}
.qty{display:flex;align-items:center;gap:10px}
.qty b{min-width:22px;text-align:center;font-size:17px}
.qty button{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--acc);font-size:20px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .go{max-width:688px;display:block;margin:0 auto}
.go{width:100%;border:0;border-radius:14px;padding:15px;background:var(--acc);color:var(--accfg);font-weight:650;font-size:17px;min-height:54px}
.go:disabled{opacity:.5}
.sum{margin:16px 0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;background:var(--soft);border-radius:14px}
.sum b{font-size:24px;color:var(--acc);font-variant-numeric:tabular-nums}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
.form input:not([type=radio]){padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;min-height:48px}
.form input:not([type=radio]):focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--soft)}
.seg{display:grid;gap:8px}
.seg label{display:flex;gap:10px;align-items:center;color:var(--fg);font-size:16px;background:var(--card);padding:13px 14px;border-radius:12px;border:1px solid var(--line)}
.seg label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--soft) 60%,var(--card))}
.seg input{accent-color:var(--acc);width:18px;height:18px}
[hidden]{display:none!important}
.err{color:var(--warn);min-height:20px;font-weight:600}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.done{text-align:center;padding:72px 0 24px}
.done h1{font-size:24px;margin:0 0 6px}.done p{color:var(--muted);margin:0 0 28px}
.ok{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--soft);color:var(--acc);font-size:44px;line-height:84px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.ok{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}}
