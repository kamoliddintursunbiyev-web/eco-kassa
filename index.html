<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Aroma Kassa</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16211a"><link rel="icon" href="icon-192.png">
<style>
/* Layout: top bar + tabs; Sotuv = catalogue left, cart right (stacks on phone) */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --surface-2:#eef1ea; --line:#dde2d6;
  --fg:#1d2419; --muted:#5f6b58; --accent:#2f6b3f; --accent-fg:#ffffff; --accent-soft:#e3efe2;
  --amber:#b8691c; --amber-soft:#fbeedd; --danger:#b3261e; --danger-soft:#fbe4e2; --ok:#2f6b3f;
  --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --font-display:"Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --side-bg:#16211a; --side-fg:#e4ede0; --side-act:#2f6b3f;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141812; --surface:#1c2219; --surface-2:#242c20; --line:#323b2d;
  --fg:#e8ede3; --muted:#a3ae9b; --accent:#7cc48c; --accent-fg:#0f1a10; --accent-soft:#22351f;
  --amber:#e7a35c; --amber-soft:#3a2a17; --danger:#f2867e; --danger-soft:#3d1d1a; --ok:#7cc48c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141812; --surface:#1c2219; --surface-2:#242c20; --line:#323b2d;
  --fg:#e8ede3; --muted:#a3ae9b; --accent:#7cc48c; --accent-fg:#0f1a10; --accent-soft:#22351f;
  --amber:#e7a35c; --amber-soft:#3a2a17; --danger:#f2867e; --danger-soft:#3d1d1a; --ok:#7cc48c; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:16px;padding-right:16px}
/* POS shell: dark sidebar + content */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:14px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{color:#fff;font-size:18px}
.side .brand small{color:#9fb59a}
.side .drop{background:#7cc48c}
.side nav.tabs{display:flex;flex-direction:column;gap:2px;overflow:visible}
.side nav.tabs button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:8px;background:none;color:inherit;padding:11px 12px;font-weight:600;text-align:left;opacity:.78;border-bottom:0}
.side nav.tabs button:hover{opacity:1;background:rgba(255,255,255,.06)}
.side nav.tabs button[aria-selected="true"]{background:var(--side-act);opacity:1;color:#fff;border-bottom:0}
.side .seller{flex-direction:column;align-items:stretch;color:#9fb59a}
.side .seller select{background:#223026;color:#fff;border-color:#33463a;padding:8px}
.side .box{background:#1e2c23;border-radius:10px;padding:10px 12px;font-size:13px;color:#b9cbb4}
.side .box b{display:block;color:#fff;font-size:20px;font-weight:700;margin-top:2px}
.side .clock{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.side .conn{align-self:flex-start}
[hidden]{display:none!important}
.app.gated{grid-template-columns:1fr}
.who{background:#1e2c23;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;color:#fff;font-weight:700}
.who small{color:#9fb59a;font-weight:500;font-size:12px}
.lock{max-width:380px;margin:40px auto;text-align:center}
.lock h1{font-size:22px;margin:0 0 4px}
.staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:560px;margin:24px auto}
.staff button{padding:22px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;color:var(--fg)}
.staff button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:4px}
.staff button:hover{border-color:var(--accent)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:18px 0;font-size:24px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.pad button:active{background:var(--accent-soft)}
.keys{font-size:12px;color:#8fa58a;line-height:1.7}
.keys kbd,kbd{font-family:inherit;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.85}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.side nav.tabs{flex-direction:row;flex-wrap:wrap}.side nav.tabs button{width:auto}.keys{display:none}}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.drop{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent)}
.spacer{flex:1}
.seller{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.seller select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.conn{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.conn.on{background:var(--accent-soft);color:var(--ok)} .conn.off{background:var(--danger-soft);color:var(--danger)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:16px 40px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.f,select.f,textarea.f{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;margin:0}
.panel-b{padding:14px}
h1.page{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0 0 12px;text-wrap:balance}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.pill.low{background:var(--amber-soft);color:var(--amber)} .pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.debt{background:var(--danger-soft);color:var(--danger)} .pill.ok{background:var(--accent-soft);color:var(--ok)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}}
.scan{display:flex;gap:8px;margin-bottom:10px}
.scan input{flex:1;font-size:16px;padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{color:var(--fg);text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:600;font-size:14px;line-height:1.25}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.card .pr{font-weight:700}
.cart{position:sticky;top:16px}
.cart-items{max-height:max(180px,calc(100vh - 560px));overflow:auto}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ci .nm{font-weight:600;font-size:14px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-weight:700}
.qty input{width:56px;text-align:center;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ci .price input{width:100px;padding:5px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--surface)}
.tot{padding:12px 14px;display:grid;gap:6px}
.tot .r{display:flex;justify-content:space-between;gap:8px}
.tot .big{font-family:var(--font-display);font-size:22px;font-weight:700}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.client-box{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.sug{border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:200px;overflow:auto}
.sug button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;text-align:left;gap:8px}
.sug button:hover{background:var(--surface-2)}
/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input{max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:var(--font-display);font-size:20px;font-weight:700;margin-top:4px}
.kpi.warn .v{color:var(--danger)} .kpi.good .v{color:var(--ok)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,8,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px;display:grid;gap:12px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.receipt{font-family:"Courier New",ui-monospace,monospace;font-size:13px;background:#fff;color:#111;padding:14px;border:1px dashed #bbb;border-radius:6px;max-width:330px;margin:0 auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:90vw}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="app">
<aside class="side">
  <div class="brand"><span class="drop" aria-hidden="true"></span><span id="shopName">Eco Aroma</span> <small>kassa</small></div>

    <button role="tab" data-tab="hisobot">Hisobot</button>
    <button role="tab" data-tab="sozlama" data-owner>Sozlamalar va zaxira</button>
  </nav>
  <div class="box">Bugungi savdo<b class="num" id="todaySum">0</b><span id="todayCnt">0 ta chek</span></div>

  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="conn" id="conn">Yuklanmoqda…</span></div>
  <button class="btn" data-act="lock" style="background:#223026;color:#fff;border-color:#33463a">Qulflash (chiqish)</button>
</aside>
<main class="wrap" id="main"></main>
